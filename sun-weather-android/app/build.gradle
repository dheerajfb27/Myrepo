plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.sunweather.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sunweather.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '4.0'
    }

    buildFeatures { compose true }

    signingConfigs {
        release {
            def ks = System.getenv('RELEASE_KEYSTORE')
            def kp = System.getenv('RELEASE_KEY_PASSWORD')
            def sp = System.getenv('RELEASE_STORE_PASSWORD')
            if (ks != null && kp != null && sp != null) {
                storeFile rootProject.file(ks)
                storePassword sp
                keyAlias 'sunweather'
                keyPassword kp
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('RELEASE_KEYSTORE') != null) { signingConfig signingConfigs.release }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation "androidx.compose.ui:ui:1.7.8"
    implementation "androidx.compose.material:material:1.7.8"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.8"
    debugImplementation "androidx.compose.ui:ui-tooling:1.7.8"
    implementation "androidx.compose.material3:material3:1.3.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.activity:activity-compose:1.9.3"

    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"

    implementation "androidx.glance:glance:1.2.0"
    implementation "androidx.glance:glance-appwidget:1.2.0"
    implementation "androidx.glance:glance-material3:1.2.0"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
}
