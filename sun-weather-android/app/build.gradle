plugins { id 'com.android.application' }

android {
    namespace 'com.sunweather.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sunweather.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('RELEASE_KEYSTORE')
            def kp = System.getenv('RELEASE_KEY_PASSWORD')
            def sp = System.getenv('RELEASE_STORE_PASSWORD')
            if (ks != null && kp != null && sp != null) {
                storeFile file(ks)
                storePassword sp
                keyAlias 'sunweather'
                keyPassword kp
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('RELEASE_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}