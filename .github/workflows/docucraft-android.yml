name: Build DocuCraft AI APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'docucraft-android/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docucraft-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: docucraft-ai-release-apk
          path: docucraft-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
