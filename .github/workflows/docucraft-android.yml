name: Build DocuCraft AI APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'docucraft-android/**'
      - '.github/workflows/docucraft-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docucraft-android
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Sign release APK
        run: |
          keytool -genkeypair -v -keystore /tmp/docucraft-release.jks -alias docucraft -keyalg RSA -keysize 2048 -validity 3650 -storepass docucraft -keypass docucraft -dname "CN=DocuCraft AI, OU=Mobile, O=DocuCraft, L=Bengaluru, ST=Karnataka, C=IN"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/docucraft-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/docucraft-release.jks --ks-pass pass:docucraft --key-pass pass:docucraft --out app/build/outputs/apk/release/docucraft-ai.apk /tmp/docucraft-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/docucraft-ai.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: docucraft-ai-apk
          path: docucraft-android/app/build/outputs/apk/release/docucraft-ai.apk
          if-no-files-found: error
          retention-days: 90
