name: Build DreamLock APK
on:
  push:
    branches: [ lock-screen-app ]
    paths: ['lock-screen/**','.github/workflows/build-lock-screen.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: lock-screen
      - uses: actions/upload-artifact@v4
        with:
          name: dreamlock-debug-apk
          path: lock-screen/app/build/outputs/apk/debug/app-debug.apk
