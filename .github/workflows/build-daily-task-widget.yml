name: Build APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: base64 -d daily-task-widget-src.b64 | tar -xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Build debug APK
        working-directory: DailyTaskWidget
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-tasks-widget-debug
          path: DailyTaskWidget/app/build/outputs/apk/debug/app-debug.apk
