name: QuoteGuru Android Build

on:
  push:
    paths:
      - 'QuoteGuru/**'
      - '.github/workflows/quoteguru-build.yml'
  pull_request:
    paths:
      - 'QuoteGuru/**'
      - '.github/workflows/quoteguru-build.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version/tag, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuoteGuru
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/QuoteGuru.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuoteGuru-debug-apk
          path: QuoteGuru/app/build/outputs/apk/debug/QuoteGuru.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version }}
          name: QuoteGuru ${{ inputs.release_version }}
          body: |
            QuoteGuru Android build
            Native Android app with resizable, multi-shaped quote widget.
          files: QuoteGuru/app/build/outputs/apk/debug/QuoteGuru.apk
          generate_release_notes: true
