name: SkyScape Fresh Android Build
on:
  push:
    branches: [skyscape-weather-widget]
    paths:
      - "SkyScapeWeatherWidget/**"
      - ".github/workflows/skyscape-weather-widget.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: skyscape-weather-widget
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle 8.11.1
        run: |
          curl -L --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon -p SkyScapeWeatherWidget assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyScape-Fresh-debug-apk
          path: SkyScapeWeatherWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
