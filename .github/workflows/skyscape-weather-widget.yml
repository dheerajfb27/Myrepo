name: SkyScape Weather Widget Build

on:
  push:
    branches: [skyscape-weather-widget]
    paths:
      - 'SkyScapeWeatherWidget/**'
      - '.github/workflows/skyscape-weather-widget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: SkyScapeWeatherWidget
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyScape-debug-apk
          path: SkyScapeWeatherWidget/app/build/outputs/apk/debug/app-debug.apk
