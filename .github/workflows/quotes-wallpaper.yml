name: Build Quote Wallpaper APK
on:
  push:
    paths:
      - 'quotes-android/**'
      - '.github/workflows/quotes-wallpaper.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quotes-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Quote-Wallpaper-debug-apk
          path: quotes-android/app/build/outputs/apk/debug/app-debug.apk
