name: Sun Weather Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'sun-weather-android/**'
      - '.github/workflows/sun-weather-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: sun-weather-android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f sun-weather-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh sun-weather-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sun-Weather-debug-apk
          path: sun-weather-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
