name: WallPro-AI Android CI
on:
  push:
    branches: ["wallpro-ai"]
  pull_request:
    branches: ["wallpro-ai"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle -p wallpro-ai assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WallPro-AI-debug
          path: wallpro-ai/app/build/outputs/apk/debug/app-debug.apk
