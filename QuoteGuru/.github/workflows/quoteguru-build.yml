name: QuoteGuru Android Build

on:
  push:
    paths:
      - 'QuoteGuru/**'
      - '.github/workflows/quoteguru-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuoteGuru
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuoteGuru-debug-apk
          path: QuoteGuru/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
